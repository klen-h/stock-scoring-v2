# 每日盘后刷新「指标缓存」（把最吃 CPU 的重活从 Render 0.1 CPU 搬到这里）
#
# 为什么搬：refresh_indicator_cache 是 300 只 × 500 根 K 线算 MA/MACD/RSI/KDJ/BOLL，
# 纯 CPU 活；且它只读数据库的 kline_cache，**不需要访问外网行情源**，
# 放到 Actions（4 核 / 16G）跑又快又稳，后端只留读表算分。
#
# ⚠️ 两个注意：
#   1. cron 是 UTC。北京时间 16:40 = UTC 08:40。
#      **必须晚于 K 线刷新（Render 15:30 = UTC 07:30）**，否则脚本会拒绝运行并告警。
#   2. GitHub Actions 的 schedule 是"尽力而为"，高峰期会延迟甚至丢失 →
#      所以配了两次 cron（主跑 + 兜底）。任务幂等（upsert 覆盖），重复跑无害。
#
# 需要配置的 Secrets（Settings → Secrets and variables → Actions）：
#   DATABASE_URL    数据库连接串（必填，缺失时脚本直接拒绝运行）
#   WECHAT_WEBHOOK  企微机器人（可选，用于失败告警）

name: Refresh Indicator Cache

on:
  schedule:
    - cron: '40 8 * * 1-5'   # 北京 16:40（主跑）
    - cron: '40 9 * * 1-5'   # 北京 17:40（兜底：应对主跑被延迟/丢弃）
  workflow_dispatch:          # 支持手动触发（测试/补跑）

# 同一时间只允许一个实例，避免上次没跑完又来一个
concurrency:
  group: indicator-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt -q

      - name: Refresh indicator cache
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/refresh_indicators.py

      - name: 失败告警（企微）
        if: failure()
        env:
          WECHAT_WEBHOOK: ${{ secrets.WECHAT_WEBHOOK }}
        run: |
          if [ -z "$WECHAT_WEBHOOK" ]; then
            echo "未配置 WECHAT_WEBHOOK secret，跳过告警（作业本身仍为失败状态）"
            exit 0
          fi
          curl -sS -X POST "$WECHAT_WEBHOOK" \
            -H 'Content-Type: application/json' \
            -d "{\"msgtype\":\"text\",\"text\":{\"content\":\"⚠️ 指标缓存刷新失败\n仓库: ${{ github.repository }}\n工作流: ${{ github.workflow }}\n详情: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}}"
        continue-on-error: true   # 告警发不出去不应掩盖真正的失败
