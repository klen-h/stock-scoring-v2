# CI：每次推送/PR 自动检查后端可编译 + 前端可构建
# 在本地跑得起≠推上去能部署——这个 workflow 挡住低级错误（语法/导入/构建失败）

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    name: 后端编译检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Python 3.9 对齐生产镜像（backend/Dockerfile 用的 python:3.9-slim）
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: 安装依赖
        run: pip install -r backend/requirements.txt -r requirements-dev.txt -q
      # ★ 2026-10-24（清理收口，docs/CLEANUP_REPORT.md）：三道新护栏——
      #   ① 代码卫生门（棘轮基线，只拦新增不追存量）；
      #   ② 日批 TASKS/DEFAULT_ORDER 一致性（BK-47：risk_calendar 曾漏排单静默断档，
      #      模块级断言随 import 生效，--list 即验证）；
      #   ③ backend/tests/generated 单元测试（涨跌停口径/交易日历/衰减/CYQ 等业务语义）。
      - name: 代码卫生门（棘轮基线）
        run: python scripts/code_hygiene_check.py
      - name: 日批任务一致性（TASKS == DEFAULT_ORDER）
        run: python scripts/daily_batch.py --list
        env:
          DATABASE_URL: "sqlite:///:memory:"
      - name: 单元测试（backend/tests/generated）
        run: python -m pytest backend/tests/generated/ -q
      - name: 全模块编译 + 导入检查
        run: |
          cd backend
          python -m compileall -q app
          # 导入 app.main 会连带导入全部路由/数据源/调度器，抓出缺失依赖和循环导入
          python -c "import app.main; print('✅ app 导入成功, 路由数:', len(app.main.app.routes))"

  frontend:
    name: 前端构建检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: 获取 pnpm 缓存目录
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT
      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-
      - name: 安装依赖
        run: cd frontend && pnpm install --frozen-lockfile
      - name: 构建
        run: cd frontend && pnpm build
