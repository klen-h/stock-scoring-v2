# CI：每次推送/PR 自动检查后端可编译 + 前端可构建
# 在本地跑得起≠推上去能部署——这个 workflow 挡住低级错误（语法/导入/构建失败）

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    name: 后端编译检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Python 3.9 对齐生产镜像（backend/Dockerfile 用的 python:3.9-slim）
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: 安装依赖
        run: pip install -r backend/requirements.txt -r requirements-dev.txt -q
      # ★ 2026-10-24（清理收口，docs/CLEANUP_REPORT.md）：三道新护栏——
      #   ① 代码卫生门（棘轮基线，只拦新增不追存量）；
      #   ② 日批 TASKS/DEFAULT_ORDER 一致性（BK-47：risk_calendar 曾漏排单静默断档，
      #      模块级断言随 import 生效，--list 即验证）；
      #   ③ backend/tests/generated 单元测试（涨跌停口径/交易日历/衰减/CYQ 等业务语义）。
      - name: 代码卫生门（棘轮基线）
        run: python scripts/code_hygiene_check.py
      # ★★ 2026-11-08 新增（**生产启动崩溃事故后补的闸**）：
      #   事故：`d343cf54` 在 `flash/scheduler.py` 的 `start()` 里写了
      #     `asyncio.create_task(etf_quote_loop())`，但**从没导入** `etf_quote_loop`
      #     ⇒ uvicorn `NameError: name 'etf_quote_loop' is not defined`
      #       ⇒ `Application startup failed. Exiting.` ⇒ 进程退出、8000 无监听、
      #         健康检查 40s 超时、部署失败。
      #   ⚠️ 为什么原有检查没拦住：`import app.main` **不会执行 lifespan**
      #      （`scheduler.start()` 是在 startup 事件里才调用的），而 `compileall`
      #      只查语法。**NameError 属于"语法合法、运行时必崩"，两者都看不见。**
      #   ⇒ pyflakes 的 `undefined name` 正好是这类问题的静态对应物（F821）。
      # 只拦 undefined name（其余 pyflakes 告警不拦，避免存量噪音淹没真问题）。
      - name: 未定义名检查（pyflakes：抓 startup/运行期才暴露的 NameError）
        run: |
          cd backend
          # 扫 app 全量 + scripts（scripts 也是本次同类问题的发现地）
          python -m pyflakes app ../scripts 2>&1 | tee /tmp/pyflakes.log || true
          if grep -q "undefined name" /tmp/pyflakes.log; then
            echo "❌ 发现未定义的变量/函数名（运行到该行必抛 NameError）："
            grep "undefined name" /tmp/pyflakes.log
            exit 1
          fi
          echo "✅ 无未定义名"
      - name: 日批任务一致性（TASKS == DEFAULT_ORDER）
        run: python scripts/daily_batch.py --list
        env:
          DATABASE_URL: "sqlite:///:memory:"
      - name: 单元测试（backend/tests/generated）
        run: python -m pytest backend/tests/generated/ -q
      - name: 全模块编译 + 导入检查
        run: |
          cd backend
          python -m compileall -q app
          # 导入 app.main 会连带导入全部路由/数据源/调度器，抓出缺失依赖和循环导入
          python -c "import app.main; print('✅ app 导入成功, 路由数:', len(app.main.app.routes))"
          # ★ 2026-11-08：调度器的**延迟导入**（写在 start()/各 loop 函数体内，如
          #   `from app.etf_board import etf_quote_loop`）在 `import app.main` 时根本不执行。
          #   本脚本静态收集 scheduler.py 里全部 `from app... import X`（128 个名字 / 56 模块），
          #   逐个真 import + hasattr 验证，抓「模块路径写错 / 模块里没这个名字」。
          #   分工：pyflakes 抓「根本没 import」；本脚本抓「import 了但目标不存在」；
          #   两者合起来覆盖 startup 期的 ImportError + NameError，且**不需要真跑 lifespan**
          #   （真跑要连库 + 外呼，CI 里会 flaky）。
          python ../scripts/smoke_scheduler_imports.py
        env:
          DATABASE_URL: "sqlite:///:memory:"

      # ★★ 2026-11-12 新增（路由劫持事故后补的闸）：
      #   事故：`routers/market.py` 里把 `@router.get("/emotion")` 和
      #     `@router.get("/auction-panel")` **堆在同一个 `auction_panel()` 上**，
      #     而真正的 `market_emotion()` **一个装饰器都没有** ⇒ `/api/market/emotion`
      #     一直返回竞价面板结构（无 `price_date`/无 `auction`）⇒ 竞价看板一闪后空白、
      #     常驻"非当日口径 · 属于 —"。**藏了约 4 天**。
      #   ⚠️ 为什么前面所有检查都没拦住：FastAPI 对重复 path **不报错**
      #     （两条都"注册成功"），`compileall` / `import app.main` / pyflakes
      #     **全部通过** —— 语法合法、名字存在、导入成功。
      #   ⇒ 只能靠"查路由表有没有同一 METHOD+path 指向两个函数"。
      - name: 路由唯一性（同一 METHOD+path 被两个函数占用）
        run: |
          cd backend
          python ../scripts/route_audit.py
        env:
          DATABASE_URL: "sqlite:///:memory:"

  frontend:
    name: 前端构建检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: 获取 pnpm 缓存目录
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT
      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-
      - name: 安装依赖
        run: cd frontend && pnpm install --frozen-lockfile
      - name: 构建
        run: cd frontend && pnpm build
