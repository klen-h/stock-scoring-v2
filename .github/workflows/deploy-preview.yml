name: Deploy Frontend to GitHub Pages

on: 
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # ★ gh-pages 发布全局串行锁：与 kline-data / backend-pack 的发布共用。
    #   push 代码会触发本任务，若与数据包发布撞车（peaceiris force push
    #   基于各自 clone 的旧树），后 push 的会把先 push 的数据包覆盖掉。
    concurrency:
      group: gh-pages-publish
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        working-directory: ./frontend
        run: pnpm install --frozen-lockfile

      - name: Build Vue.js project
        working-directory: ./frontend
        run: pnpm run build

      # ★ 双保险（2026-09-08 第二次覆盖事故）：public/data/ 里残留的开发期
      #   小样本包（270KB kline-pack / 464KB indicators-pack）被 Vite 原样拷进
      #   dist，发布时把 gh-pages 上 2.7MB/5.7MB 的正式包覆盖回小包（前端
      #   "下载数据"只剩 118 只）。根因已除（git rm public/data），这里再兜
      #   一道：dist 里不允许出现任何 data/ 数据文件。
      - name: Remove stray data packs from dist
        run: rm -rf frontend/dist/data

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend/dist
          # 必须 keep_files：否则每次 push 都会清空重建 gh-pages 分支，
          # 把 kline-data 工作流发布的 data/（K 线数据包）删掉，前端下载 404
          keep_files: true