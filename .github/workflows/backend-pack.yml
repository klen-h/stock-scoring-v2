name: Generate Backend Data Pack

on:
  # ★ 2026-09-08：GitHub 自带 schedule 已停用（延迟大 + 与第三方重复触发导致双跑）。
  #   现在由 https://console.cron-job.org/ 配置 `0 19 * * 1-5`（北京时间 19:00）
  #   调用 workflow_dispatch 触发 —— 排在前端包（18:00，约 37 分钟）之后，
  #   配额已恢复、quotes 已生效；后端包约 1h43m，**~20:43 完成**，
  #   daily-batch 由 workflow_run 自动接棒（约 74 分钟 → ~21:57 结束）。
  # ★ 2026-09-13：整体由 16:00/17:00 推迟到 18:00/19:00 —— 腾讯当日 K 线在 16:00
  #   时常未更新完整，会打出「缺末根」的当日数据。
  #
  # ★★ 2026-09-25（P0，用户批准）：**加回一条兜底 schedule** ——
  #   【为什么】整条触发链 = cron-job.org → backend-pack → workflow_run → daily-batch，
  #   没有任何一环由 GitHub 自己保证 ⇒ 第三方抖一天 = 日批停一天 = 人工补
  #   （历史上 zz_daily/周报等都因此断过档）。
  #   【为什么兜在上游】日批没有新包会被 `ensure_pack_fresh` 卡 30 分钟后中止
  #   ⇒ 只兜日批没用；兜上游则上游完成后 workflow_run **自动**接棒日批。
  #   【为什么是 UTC 14:00（北京 22:00）】正常路径 ~21:57 全链完成 ⇒ 此刻查
  #     「最近 12h 有无成功的 backend-pack」可**可靠判定**今天是否已跑：
  #     已跑 ⇒ skip（避免每天双跑：重复 1h43m 计算 + 重烧 LLM + Pages 覆盖）；
  #     没跑（第三方挂）⇒ 真正兜底：22:00-23:43 补包 → 日批 workflow_run 接棒。
  #     ⚠️ 不能早于 21:00：正常路径 20:43 才完成，早了会把"正在跑"误判成"没跑"。
  #   【跨午夜补跑的安全性】23:43 完成后日批 ~00:57 结束 ⇒ 各任务的日期键
  #     必须用 `_batch_trading_day()`（最近已完成交易日）—— trader_brief/zz_finance/
  #     weekly_report/subfactor_ic 均已按此修（2026-09-19/25）。
  #   【幂等】各任务写库均 ON CONFLICT ⇒ 双跑不会出两份数据；本 guard 用
  #     `gh run list` 判定（无 DB 依赖），比查 schedule_state 更轻且不占数据库配额。
  schedule:
    - cron: '0 14 * * 1-5'    # ★ GitHub cron 是 UTC！= 北京 22:00，周一~周五（不看节假日，无妨）
  workflow_dispatch:
    inputs:
      workers:
        description: 'K线拉取并发数'
        required: false
        default: '5'
      skip_mainforce:
        description: '跳过主力行为计算(true/false)'
        required: false
        default: 'false'
      waf_cooldown:
        # ★ 2026-09-18 实测回归：45 → 120。
        #   9-18 那次（45/2/5）在 Actions 上跑到 **180 分钟被 timeout 砍掉**，
        #   只完成第 1 轮 1200/2081、[WAF] 拦截 23 次，冷却是全局的 ⇒ 名义
        #   23×300s ≈ 1.9h 全在静默 —— 冷却吞掉了大部分墙钟。
        #   45 是 9-17 引入的「配合限速」激进值，代码注释本就记载「固定 45s 时拦截
        #   从 40+ 升到 ~117 次、耗时反而更长」。回 120（= 脚本 generate-kline-pack.py
        #   的默认值，两处终于一致），自适应 ×2 只需 3 步就到 300 上限，比 45 更早
        #   进入长静默、更少无谓重试。
        description: 'WAF 全局冷却基准秒数（默认 120，会自适应 ×2 加码到 300）'
        required: false
        default: '120'
      qps:
        # ★ 2026-09-18：2 → 1。代码注释给的处置阶梯是「若仍有拦截 → 降到 1」，
        #   而 9-18 那次正是「仍有拦截」（23 次）⇒ 按阶梯降档。
        #   注意这是**反直觉**的：降速后单只耗时变长，但撞墙次数和全局冷却大幅减少，
        #   总墙钟通常反而更短（9-18 那 1.9h 的静默就是撞出来的）。
        description: '★ 全进程请求速率上限（默认 1；这是控 WAF 的主旋钮，仍有拦截就再降）'
        required: false
        default: '1'
      rebuild_only:
        # ★★ 2026-10-29（用户：日批在内存修复前就跑完了，需要重跑）：
        #   场景 = **数据已经到位、只有表结构要换**（如 klines 加 WITHOUT ROWID）。
        #   为什么普通重跑无效：update_backend_pack_incremental.py 顶部有
        #     `if target_ymd <= prev_ymd: print("已是最新"); return 0`
        #   数据没变 ⇒ 直接早退 ⇒ 表结构原封不动（10-29 当晚就是这样白跑了一次）。
        #   打开本开关 ⇒ 跳过 mainflow / 增量 / 等前端包，只跑
        #   `scripts/rebuild_pack_struct.py`（下载线上包 → 重写表结构 → 校验 → 重新压缩），
        #   **不拉 K 线、不重算指标、不碰 Supabase**，Actions 上约 1~2 分钟。
        description: '仅重建包结构（WITHOUT ROWID）：跳过 mainflow 与增量，不加数据只换结构'
        required: false
        default: 'false'

concurrency:
  group: backend-pack
  cancel-in-progress: false

jobs:
  # ★ 守卫（2026-09-25 扩展）：三种触发三种判定 ——
  #   · workflow_run：上游（自己）不可能 —— 本 workflow 没有上游，此分支保留以防误配
  #   · schedule（兜底）：最近 12h 已有成功 run ⇒ 今天已跑过 ⇒ **skip 整个 workflow**
  #     （否则兜底 cron 会每天固定双跑一次 1h43m 的计算 + 重烧 LLM + 覆盖 Pages）
  #   · workflow_dispatch（手动/第三方）：直接放行
  guard:
    # ★★ 2026-10-08 修「兜底守卫从未生效（每天固定双跑）」—— 用户报"假期日批照跑"时挖出：
    #   实测上游每天两条：`Manually run by klen-h` 19:00（cron-job.org 的 dispatch，准时 ✓）
    #   + `Scheduled` ~03:xx 北京（GitHub 兜底 cron，名义 14:00 UTC=北京 22:00，**实际晚 ~5h**）。
    #   而兜底**本该被本 guard 判 skip**（"最近 12h 已有成功 run"）—— 实测时长仍是
    #   1h12m~1h31m（整包跑满；skip 的话只有几秒）⇒ **judge 恒为 0**。
    # 【根因（已从代码钉死，非猜测）】原命令靠 `gh run list` 查历史，但：
    #   ① 本 job **没有 `actions/checkout`** ⇒ 工作区无 `.git`；
    #   ② **`gh` 不读 `GITHUB_REPOSITORY`**，它从**当前目录的 git remote** 推断仓库
    #      （或 `GH_REPO` / `--repo`）⇒ 在空工作区里 `gh run list` 直接报
    #      "not a git repository"；
    #   ③ 该错误被 **`2>/dev/null` 吞掉**、再由 `|| echo 0` 补成 0 ⇒ 判据恒 0 ⇒
    #      **永不 skip** ⇒ 每天白跑一次完整链（包 ~1h20m + 日批 ~55m ≈ 2h15m/天）。
    #   ⇒ 修法：显式给 `GH_REPO`（等价于 `--repo`，无需 checkout 更轻）；
    #     并**不再吞错** —— 失败时打 warning 且按"不跳过"处理（**宁多跑一次，不误跳**）。
    permissions:
      actions: read          # gh run list 读运行历史所需（仓库若限制了默认权限，缺它即 403）
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          # ★ 必须显式指定：本 job 未 checkout，gh 无法从目录推断仓库
          GH_REPO: ${{ github.repository }}
          CURRENT_RUN: ${{ github.run_id }}
        run: |
          EVENT="${{ github.event_name }}"
          echo "event=$EVENT repo=$GH_REPO current=$CURRENT_RUN"
          SKIP=false
          # ★★ 2026-10-21：先判「是否已有本 workflow 在跑/排队」（排除自己）。
          #   背景：本 job 现在会等前端包（最多 180 分钟），正常 20:43 完成的假设不再成立
          #   ⇒ 22:00（北京）的兜底 schedule 很可能在**第一次还没跑完时**触发。
          #   原守卫只看「最近 12h 是否有 success」——跑着的这次还不是 success ⇒ 不跳过
          #   ⇒ 排队再跑一遍完整的 2.5 小时（且和第一次抢同一配额）。
          if RUNNING=$(gh run list --workflow=backend-pack.yml --limit 30 \
                --json databaseId,status \
                --jq "[.[] | select(.databaseId != $CURRENT_RUN and (.status==\"in_progress\" or .status==\"queued\"))] | length"); then
            echo "running_or_queued=$RUNNING"
          else
            RUNNING=0
            echo "::warning::gh run list 查询失败，无法判定是否有并发运行（按不跳过处理）"
          fi
          if [ "$RUNNING" -gt 0 ]; then
            echo "⏭ 已有 backend-pack 在跑/排队 ⇒ 本次跳过（防双跑）"
            SKIP=true
          fi
          if [ "$SKIP" = "false" ] && [ "$EVENT" = "schedule" ]; then
            # 兜底守卫：最近 12 小时内已有成功的 backend-pack ⇒ 今天正常路径已跑过
            if OK=$(gh run list --workflow=backend-pack.yml --status=success \
                      --created=">=$(date -u -d '12 hours ago' +%Y-%m-%dT%H:%M)" \
                      --limit 20 --json databaseId --jq 'length'); then
              echo "recent_success_runs=$OK"
            else
              # 查询失败 ⇒ 无法判定 ⇒ 按"不跳过"处理（宁多跑一次，不误跳一天）
              echo "::warning::gh run list 查询失败，无法判定今天是否已跑 ⇒ 本兜底照常执行"
              OK=0
            fi
            if [ "$OK" -gt 0 ]; then
              echo "⏭ 最近 12h 已有成功的 backend-pack（正常路径已完成）⇒ 兜底跳过"
              SKIP=true
            fi
          fi
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"

  backend-pack:
    name: 后端包（K线 + 预计算指标 + 主力行为）
    needs: guard
    # ★ schedule 兜底判定"今天已跑过"时整体跳过（deploy-pages 因 needs 也会自动 skip）
    if: needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-latest
    # ★ 2026-09-10 池扩容到战法池口径（1431 → ~2080 只，+45%）后实测需 ~130 分钟，
    #   原 150 分钟余量太薄，放宽到 180。
    # ★★ 2026-10-21：180 → **360**（GitHub 上限）。池已涨到 **2915 只**（+ 科创/创业板/回测池），
    #   按腾讯当前实际配额（≈0.3~0.4 QPS）主轮就要 120~160 分钟；再叠加"等前端包跑完"
    #   的等待（最多 180 分钟）⇒ 300 分钟也可能不够，给到 GitHub 上限 360。
    # ★★ 2026-10-22：改 zzshare 增量（下载上一份包 66MB + 2~3 次日线 + 重算指标），
    #   正常 10~15 分钟；120 分钟是给"日线未发布"重试（6×10 分钟）+ mainflow 兜底。
    timeout-minutes: 120
    # ★ wait-for-frontend 步骤要用 gh run list 查运行历史
    permissions:
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ★★ 2026-10-21：**等前端包跑完再拉**（10-20 后端包失败的真正放大器）。
      #   前端包 18:00 启动，正常 ~37 分钟；一旦被 WAF 拖到 150~240 分钟，就会与
      #   19:00 启动的本 job **重叠**。两个 job 虽然在不同 runner 上，但 GitHub
      #   托管 runner 的出口 IP 并不保证互不相同（同区域 NAT 复用），而腾讯是
      #   **IP 级滑动窗口配额** ⇒ 后端包一开局就只有 ~100 个请求的额度
      #   （10-20 日志：第 1 次 WAF 出现在 99 只），随后 300s 冷却连环触发。
      #   这里显式等（最多 180 分钟），正常日子前端 18:37 已结束 ⇒ 零等待。
      - name: Wait for frontend pack (avoid WAF quota overlap)
        # ★ rebuild_only 不拉任何外部行情（只下载自己的 Pages 包）⇒ 无 WAF 配额冲突，
        #   不需要等前端包，否则白等最多 20 分钟。
        if: ${{ github.event.inputs.rebuild_only != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # ★ 2026-10-22：前端包改增量后 ~5 分钟；这里只需等它把新包推上 Pages，
          #   最多 20 分钟（原 180 分钟是为 2.5h 的腾讯全量拉的）。
          for i in $(seq 1 10); do
            N=$(gh run list --workflow=kline-data.yml --limit 20 --json status \
                  --jq '[.[] | select(.status=="in_progress" or .status=="queued")] | length' \
                  2>/dev/null || echo 0)
            if [ "$N" = "0" ]; then
              echo "frontend pack idle -> continue"
              exit 0
            fi
            echo "frontend pack still running (${i}/10), wait 120s"
            sleep 120
          done
          echo "::warning::waited 20min for frontend pack; continue anyway"

      - name: Log egress IP (WAF diagnosis)
        run: curl -s --max-time 10 https://api.ipify.org || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        # 装完整 requirements（含 fastapi）：复用后端 compute_latest_indicators
        # 与 mainforce overlay，精简安装会在计算步骤全军覆没（2026-09-05 实测）
        run: pip install -q -r backend/requirements.txt

      - name: Smoke import (fail fast on scheduler/router breaks)
        run: |
          cd backend
          python -c "import app.main; print('smoke import ok')"

      # 后端数据包（质量池 ~700 只×750 根 + 预计算指标 + 主力行为）：
      # DATA_SOURCE=pack/local 读取层用，让 Render 不再读 Supabase 肥表。
      # DATABASE_URL 用于：读 kline_cache 代码清单 + 近 10 日 mainflow_history。
      # ★ mainforce 强口径前置：Render 只读后资金流回填也迁到了 Actions。
      #   新浪源逐股 ~0.75s，全池约 7 分钟；不跑这步 mainforce 会用昨日资金流
      #   （弱口径）。写库幂等（UNIQUE(code,date)），日批再跑一遍无害。
      - name: Backfill mainflow (mainforce 强口径前置)
        # ★ rebuild_only 只换包结构、不加数据 ⇒ 资金流当天已回填过，重跑纯属浪费
        #   （约 7 分钟 + 读 Supabase mainflow_history/kline_cache，egress 已 19.46GB）。
        if: ${{ github.event.inputs.rebuild_only != 'true' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATA_SOURCE: pack
          # ★ 2026-09-19：本步骤只回填资金流、**完全不碰 LLM** ⇒ 环境里本就没有
          #   LLM 变量，启动自检必然打出「空链」告警（本步骤也没配那三个业务开关，
          #   同样告警）。显式抑制 ⇒ **避免告警脱敏**（天天刷误报，真出问题反而没人看）。
          ENV_CHECK_SKIP_LLM: '1'
          # ★ 同上：本步骤只跑 mainflow，不碰策略链路，那三个开关的值**只被自检读取**
          #   ⇒ 不配就会每天刷三条"不符"告警。这里补上与**部署意图一致的值**
          #   （非密钥，可直接写死），让日志干净 ⇒ 真出现不符时才有信号价值。
          WHITELIST_CRITERION: expectancy
          CONTRADICTION_RISK_HOOK: '1'
          # ★ 2026-10-18 定案 off（与代码默认/模板/日批一致；原 auto 是静默分叉）
          MAINFORCE_MODE: off
        run: python scripts/daily_batch.py --tasks mainflow --no-pack-check --no-quotes

      - name: Update backend pack incrementally (zzshare)
        # ★ rebuild_only 时本步骤必须跳过：它会在「数据已最新」时 return 0 早退，
        #   **什么也不改**（正是 10-29 瘦身没生效的原因）⇒ 结构重写由下一步负责。
        if: ${{ github.event.inputs.rebuild_only != 'true' }}
        # ★★ 2026-10-22：不再逐只拉腾讯（2915 只 × 750 根 = 3~6h + WAF）。
        #   新链路：Pages 上一份包（66MB，1 请求）→ zzshare 缺口交易日（2~3 请求）
        #   → 拼接（重叠/factor 校验）→ 重算 indicators/trend；mainforce/news 继承上一份。
        #   日线未发布返回 2：10 分钟后重试（最多 6 次）。
        env:
          ZZSHARE_TOKEN: ${{ secrets.ZZSHARE_TOKEN }}
          # ★ 2026-10-31（用户："评分排行榜的主力行为怎么没有了"）：
          #   本步骤此前**没有 DATABASE_URL**（只读写本地文件），而
          #   `update_backend_pack_incremental.py` 新增的 mainforce 兜底需要读
          #   `mainforce_state` 表 —— 不注入该变量时 db 会退回本地 SQLite（空库），
          #   兜底静默失效（又是"配了但没生效"那类坑）。
          #   成本：每日一次 `code = ANY(...)` ≈0.4MB（占月配额 0.24%）。
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # 与兜底读取的日志口径对齐：本步骤不碰策略链，抑制无关自检告警
          ENV_CHECK_SKIP_LLM: '1'
        run: |
          for i in $(seq 1 6); do
            python scripts/update_backend_pack_incremental.py \
              --pack-dir ./data/kline --backfill && exit 0
            echo "::warning::zzshare 日线未就绪或增量失败，10 分钟后重试 ($i/6)"
            sleep 600
          done
          echo "::error::增量重试 6 次仍失败"
          exit 1

      - name: Rebuild pack structure (WITHOUT ROWID only)
        # ★★ 2026-10-29：**纯结构重写**，不拉数据、不重算指标、不读 Supabase。
        #   为什么单独一个步骤而不是改增量脚本：增量脚本的 `write_sqlite` 需要把
        #   2.1M 行 K 线 + 2884 份指标 JSON 全读进内存重组一遍，而这里数据**一个字节都没变**，
        #   SQLite 自己 `INSERT ... SELECT` 更快也更不容易错；而且不碰合并逻辑 ⇒ 无回归风险。
        #   校验不过直接 exit 1，**绝不覆盖线上包**。
        if: ${{ github.event.inputs.rebuild_only == 'true' }}
        run: python scripts/rebuild_pack_struct.py --pack-dir ./data/kline

      - name: Upload Pages artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-pages
          path: |
            ./data/kline/backend-pack.db.gz
            ./data/kline/indicators-pack.json.gz
          retention-days: 3

  deploy-pages:
    name: 发布 GitHub Pages（后端包）
    needs: backend-pack
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # ★ gh-pages 发布全局串行锁：与 kline-data 的发布共用（防 force push 互相覆盖）
    concurrency:
      group: gh-pages-publish
      cancel-in-progress: false

    steps:
      - name: Download pack artifacts
        uses: actions/download-artifact@v4
        with:
          name: backend-pages
          path: ./data/kline

      - name: Upload to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GH_PAGES_TOKEN }}
          publish_dir: ./data/kline
          publish_branch: gh-pages
          destination_dir: data
          keep_files: true  # 保留前端包等其它文件
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'chore: update backend data pack (klines + indicators + mainforce)'
