name: Generate Backend Data Pack

on:
  # ★ 2026-09-08：GitHub 自带 schedule 已停用（延迟大 + 与第三方重复触发导致双跑）。
  #   现在由 https://console.cron-job.org/ 配置 `0 19 * * 1-5`（北京时间 19:00）
  #   调用 workflow_dispatch 触发 —— 排在前端包（18:00，约 37 分钟）之后，
  #   配额已恢复、quotes 已生效；后端包约 1h43m，**~20:43 完成**，
  #   daily-batch 由 workflow_run 自动接棒（约 74 分钟 → ~21:57 结束）。
  # ★ 2026-09-13：整体由 16:00/17:00 推迟到 18:00/19:00 —— 腾讯当日 K 线在 16:00
  #   时常未更新完整，会打出「缺末根」的当日数据。
  #
  # ★★ 2026-09-25（P0，用户批准）：**加回一条兜底 schedule** ——
  #   【为什么】整条触发链 = cron-job.org → backend-pack → workflow_run → daily-batch，
  #   没有任何一环由 GitHub 自己保证 ⇒ 第三方抖一天 = 日批停一天 = 人工补
  #   （历史上 zz_daily/周报等都因此断过档）。
  #   【为什么兜在上游】日批没有新包会被 `ensure_pack_fresh` 卡 30 分钟后中止
  #   ⇒ 只兜日批没用；兜上游则上游完成后 workflow_run **自动**接棒日批。
  #   【为什么是 UTC 14:00（北京 22:00）】正常路径 ~21:57 全链完成 ⇒ 此刻查
  #     「最近 12h 有无成功的 backend-pack」可**可靠判定**今天是否已跑：
  #     已跑 ⇒ skip（避免每天双跑：重复 1h43m 计算 + 重烧 LLM + Pages 覆盖）；
  #     没跑（第三方挂）⇒ 真正兜底：22:00-23:43 补包 → 日批 workflow_run 接棒。
  #     ⚠️ 不能早于 21:00：正常路径 20:43 才完成，早了会把"正在跑"误判成"没跑"。
  #   【跨午夜补跑的安全性】23:43 完成后日批 ~00:57 结束 ⇒ 各任务的日期键
  #     必须用 `_batch_trading_day()`（最近已完成交易日）—— trader_brief/zz_finance/
  #     weekly_report/subfactor_ic 均已按此修（2026-09-19/25）。
  #   【幂等】各任务写库均 ON CONFLICT ⇒ 双跑不会出两份数据；本 guard 用
  #     `gh run list` 判定（无 DB 依赖），比查 schedule_state 更轻且不占数据库配额。
  schedule:
    - cron: '0 14 * * 1-5'    # ★ GitHub cron 是 UTC！= 北京 22:00，周一~周五（不看节假日，无妨）
  workflow_dispatch:
    inputs:
      workers:
        description: 'K线拉取并发数'
        required: false
        default: '5'
      skip_mainforce:
        description: '跳过主力行为计算(true/false)'
        required: false
        default: 'false'
      waf_cooldown:
        # ★ 2026-09-18 实测回归：45 → 120。
        #   9-18 那次（45/2/5）在 Actions 上跑到 **180 分钟被 timeout 砍掉**，
        #   只完成第 1 轮 1200/2081、[WAF] 拦截 23 次，冷却是全局的 ⇒ 名义
        #   23×300s ≈ 1.9h 全在静默 —— 冷却吞掉了大部分墙钟。
        #   45 是 9-17 引入的「配合限速」激进值，代码注释本就记载「固定 45s 时拦截
        #   从 40+ 升到 ~117 次、耗时反而更长」。回 120（= 脚本 generate-kline-pack.py
        #   的默认值，两处终于一致），自适应 ×2 只需 3 步就到 300 上限，比 45 更早
        #   进入长静默、更少无谓重试。
        description: 'WAF 全局冷却基准秒数（默认 120，会自适应 ×2 加码到 300）'
        required: false
        default: '120'
      qps:
        # ★ 2026-09-18：2 → 1。代码注释给的处置阶梯是「若仍有拦截 → 降到 1」，
        #   而 9-18 那次正是「仍有拦截」（23 次）⇒ 按阶梯降档。
        #   注意这是**反直觉**的：降速后单只耗时变长，但撞墙次数和全局冷却大幅减少，
        #   总墙钟通常反而更短（9-18 那 1.9h 的静默就是撞出来的）。
        description: '★ 全进程请求速率上限（默认 1；这是控 WAF 的主旋钮，仍有拦截就再降）'
        required: false
        default: '1'

concurrency:
  group: backend-pack
  cancel-in-progress: false

jobs:
  # ★ 守卫（2026-09-25 扩展）：三种触发三种判定 ——
  #   · workflow_run：上游（自己）不可能 —— 本 workflow 没有上游，此分支保留以防误配
  #   · schedule（兜底）：最近 12h 已有成功 run ⇒ 今天已跑过 ⇒ **skip 整个 workflow**
  #     （否则兜底 cron 会每天固定双跑一次 1h43m 的计算 + 重烧 LLM + 覆盖 Pages）
  #   · workflow_dispatch（手动/第三方）：直接放行
  guard:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EVENT="${{ github.event_name }}"
          echo "event=$EVENT"
          SKIP=false
          if [ "$EVENT" = "schedule" ]; then
            # 兜底守卫：最近 12 小时内已有成功的 backend-pack ⇒ 今天正常路径已跑过
            OK=$(gh run list --workflow=backend-pack.yml --status=success \
                   --created=">=$(date -u -d '12 hours ago' +%Y-%m-%dT%H:%M)" \
                   --json databaseId --jq 'length' 2>/dev/null || echo 0)
            echo "recent_success_runs=$OK"
            if [ "$OK" -gt 0 ]; then
              echo "⏭ 最近 12h 已有成功的 backend-pack（正常路径已完成）⇒ 兜底跳过"
              SKIP=true
            fi
          fi
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"

  backend-pack:
    name: 后端包（K线 + 预计算指标 + 主力行为）
    needs: guard
    # ★ schedule 兜底判定"今天已跑过"时整体跳过（deploy-pages 因 needs 也会自动 skip）
    if: needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-latest
    # ★ 2026-09-10 池扩容到战法池口径（1431 → ~2080 只，+45%）后实测需 ~130 分钟，
    #   原 150 分钟余量太薄，放宽到 180。
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        # 装完整 requirements（含 fastapi）：复用后端 compute_latest_indicators
        # 与 mainforce overlay，精简安装会在计算步骤全军覆没（2026-09-05 实测）
        run: pip install -q -r backend/requirements.txt

      - name: Smoke import (fail fast on scheduler/router breaks)
        run: |
          cd backend
          python -c "import app.main; print('smoke import ok')"

      # 后端数据包（质量池 ~700 只×750 根 + 预计算指标 + 主力行为）：
      # DATA_SOURCE=pack/local 读取层用，让 Render 不再读 Supabase 肥表。
      # DATABASE_URL 用于：读 kline_cache 代码清单 + 近 10 日 mainflow_history。
      # ★ mainforce 强口径前置：Render 只读后资金流回填也迁到了 Actions。
      #   新浪源逐股 ~0.75s，全池约 7 分钟；不跑这步 mainforce 会用昨日资金流
      #   （弱口径）。写库幂等（UNIQUE(code,date)），日批再跑一遍无害。
      - name: Backfill mainflow (mainforce 强口径前置)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATA_SOURCE: pack
          # ★ 2026-09-19：本步骤只回填资金流、**完全不碰 LLM** ⇒ 环境里本就没有
          #   LLM 变量，启动自检必然打出「空链」告警（本步骤也没配那三个业务开关，
          #   同样告警）。显式抑制 ⇒ **避免告警脱敏**（天天刷误报，真出问题反而没人看）。
          ENV_CHECK_SKIP_LLM: '1'
          # ★ 同上：本步骤只跑 mainflow，不碰策略链路，那三个开关的值**只被自检读取**
          #   ⇒ 不配就会每天刷三条"不符"告警。这里补上与**部署意图一致的值**
          #   （非密钥，可直接写死），让日志干净 ⇒ 真出现不符时才有信号价值。
          WHITELIST_CRITERION: expectancy
          CONTRADICTION_RISK_HOOK: '1'
          MAINFORCE_MODE: auto
        run: python scripts/daily_batch.py --tasks mainflow --no-pack-check --no-quotes

      - name: Generate backend data pack (klines + indicators + mainforce)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # ★ count 硬上限 800（脚本内建，勿删）：腾讯 fqkline 对 days*2=2200 直接
          #   拒绝返回 0 根——这是后端包一直拉不到数据的真正根因（2026-09-07 实测）。
          # ★ 超时给足 15s：750 根响应体大，6s 会误杀慢请求。
          # ★ 连败暂停阈值 15：仅在真出问题时兜底，不让频繁 sleep 拖慢正常拉取。
          PACK_REQUEST_TIMEOUT: '15'
          PACK_KLINE_RETRIES: '2'
          PACK_RETRY_BACKOFF: '1,2'
          PACK_CONSECUTIVE_COOLDOWN: '15'
          # ★ 2026-09-17 复盘（重要，别再单纯改这个数字）：
          #   9-15 把冷却 120 → 45s 的依据是「120s 太长、罚站是耗时主因」。9-17 实测
          #   否证了这个推断：当天日志 [WAF] 拦截 **~117 次**（改前注释记载 40+ 次），
          #   且进度多次整段停滞（506/2057 连续 3 个 50 只窗口、967/2057 连续 150 只
          #   零成功）→ 45s 不但没更省时间，反而把封禁拉成了连续惩罚。
          #   机制：腾讯按「滑动窗口速率」判定，45s 的静默排不空窗口 → 冷却结束立刻
          #   又被拦 → 再冷却；同时冷却中「睡一轮就放弃」把股票误记为失败 → 重试轮
          #   再打一遍请求 → 正反馈。
          #   → 已在 generate-kline-pack.py 修：① 冷却期内再 501 就自适应 ×2 加码
          #     （45→90→180，PACK_WAF_MAX_COOLDOWN 封顶 300），任一成功即回落基准；
          #     ② 冷却改为「循环睡到解除」，不再批量误记失败；③ 跑完打印 WAF 汇总
          #     （拦截次数/累计等待/末次退避），下次 A/B 有硬数据。
          #   ★ 2026-09-18：基准 45 → 120（与脚本 generate-kline-pack.py 的默认值对齐，
          #     那两处长期不一致，见 inputs 处的回归说明）。
          PACK_WAF_COOLDOWN: ${{ github.event.inputs.waf_cooldown || '120' }}
          # ★★ 2026-09-17 主旋钮：全进程请求速率上限（令牌桶，无突发）。
          #   被动冷却只能事后止血 —— 只要"发出的请求速率"高于腾讯阈值就必然反复撞墙，
          #   而 WAF 按滑动窗口判定，撞得越勤窗口越排不空 → 自锁（这正是耗时失控的机制）。
          #   实测：原「5 线程 × 每线程 0.5~0.9s sleep」≈ 峰值 7 req/s、5 个请求可同时飞出。
          #   2 QPS = 120 请求/分钟；2057 只理论下限 ≈ 17 分钟。
          #   ★ 2026-09-18：2 QPS 实测**仍然撞**（Actions 上 23 次拦截、180 分钟被 timeout 砍），
          #     按本注释的处置阶梯降到 1。1 QPS ⇒ 2057 只下限 ≈ 35 分钟，仍在 timeout 内。
          #     若显示零拦截且嫌慢 → 再试 2~3（先看日志末尾那行 WAF 汇总）。
          PACK_QPS: ${{ github.event.inputs.qps || '1' }}
          PACK_WORKERS: ${{ github.event.inputs.workers || '5' }}
          PACK_QUOTES_URL: 'https://klen-h.github.io/stock-scoring-v2/data/realtime-quotes.json'
        run: |
          python scripts/generate_backend_pack.py \
            --output-dir ./data/kline \
            ${{ github.event.inputs.skip_mainforce == 'true' && '--no-mainforce' || '' }}

      - name: Upload Pages artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-pages
          path: |
            ./data/kline/backend-pack.db.gz
            ./data/kline/indicators-pack.json.gz
          retention-days: 3

  deploy-pages:
    name: 发布 GitHub Pages（后端包）
    needs: backend-pack
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # ★ gh-pages 发布全局串行锁：与 kline-data 的发布共用（防 force push 互相覆盖）
    concurrency:
      group: gh-pages-publish
      cancel-in-progress: false

    steps:
      - name: Download pack artifacts
        uses: actions/download-artifact@v4
        with:
          name: backend-pages
          path: ./data/kline

      - name: Upload to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GH_PAGES_TOKEN }}
          publish_dir: ./data/kline
          publish_branch: gh-pages
          destination_dir: data
          keep_files: true  # 保留前端包等其它文件
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'chore: update backend data pack (klines + indicators + mainforce)'
