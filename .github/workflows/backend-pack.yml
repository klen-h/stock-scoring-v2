name: Generate Backend Data Pack

on:
  # 北京时间 17:00 = UTC 09:00（周一到周五）
  # ★ 时间依据（2026-09-07 实测）：前端包约 32 分钟（16:00-16:32，quotes 16:34
  #   生效）；后端包实测 1h43m。17:00 开始 → 18:43 完成 → 19:45 前日批必就绪。
  #   与前端包错峰 ~30 分钟，配额已恢复；主力资金流 17:00 起回填，
  #   mainforce 的资金流强口径会滞后一天时，overlay 自动退化弱口径（可接受）。
  schedule:
    - cron: '0 9 * * 1-5'

  workflow_dispatch:
    inputs:
      workers:
        description: 'K线拉取并发数'
        required: false
        default: '5'
      skip_mainforce:
        description: '跳过主力行为计算(true/false)'
        required: false
        default: 'false'

concurrency:
  group: backend-pack
  cancel-in-progress: false

jobs:
  backend-pack:
    name: 后端包（K线 + 预计算指标 + 主力行为）
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        # 装完整 requirements（含 fastapi）：复用后端 compute_latest_indicators
        # 与 mainforce overlay，精简安装会在计算步骤全军覆没（2026-09-05 实测）
        run: pip install -q -r backend/requirements.txt

      - name: Smoke import (fail fast on scheduler/router breaks)
        run: |
          cd backend
          python -c "import app.main; print('smoke import ok')"

      # 后端数据包（质量池 ~700 只×750 根 + 预计算指标 + 主力行为）：
      # DATA_SOURCE=pack/local 读取层用，让 Render 不再读 Supabase 肥表。
      # DATABASE_URL 用于：读 kline_cache 代码清单 + 近 10 日 mainflow_history。
      # ★ mainforce 强口径前置：Render 只读后资金流回填也迁到了 Actions。
      #   新浪源逐股 ~0.75s，全池约 7 分钟；不跑这步 mainforce 会用昨日资金流
      #   （弱口径）。写库幂等（UNIQUE(code,date)），日批再跑一遍无害。
      - name: Backfill mainflow (mainforce 强口径前置)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATA_SOURCE: pack
        run: python scripts/daily_batch.py --tasks mainflow --no-pack-check --no-quotes

      - name: Generate backend data pack (klines + indicators + mainforce)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # ★ count 硬上限 800（脚本内建，勿删）：腾讯 fqkline 对 days*2=2200 直接
          #   拒绝返回 0 根——这是后端包一直拉不到数据的真正根因（2026-09-07 实测）。
          # ★ 超时给足 15s：750 根响应体大，6s 会误杀慢请求。
          # ★ 连败暂停阈值 15：仅在真出问题时兜底，不让频繁 sleep 拖慢正常拉取。
          PACK_REQUEST_TIMEOUT: '15'
          PACK_KLINE_RETRIES: '2'
          PACK_RETRY_BACKOFF: '1,2'
          PACK_CONSECUTIVE_COOLDOWN: '15'
          PACK_WORKERS: ${{ github.event.inputs.workers || '5' }}
          PACK_QUOTES_URL: 'https://klen-h.github.io/stock-scoring-v2/data/realtime-quotes.json'
        run: |
          python scripts/generate_backend_pack.py \
            --output-dir ./data/kline \
            ${{ github.event.inputs.skip_mainforce == 'true' && '--no-mainforce' || '' }}

      - name: Upload Pages artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-pages
          path: |
            ./data/kline/backend-pack.db.gz
            ./data/kline/indicators-pack.json.gz
          retention-days: 3

  deploy-pages:
    name: 发布 GitHub Pages（后端包）
    needs: backend-pack
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download pack artifacts
        uses: actions/download-artifact@v4
        with:
          name: backend-pages
          path: ./data/kline

      - name: Upload to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GH_PAGES_TOKEN }}
          publish_dir: ./data/kline
          publish_branch: gh-pages
          destination_dir: data
          keep_files: true  # 保留前端包等其它文件
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'chore: update backend data pack (klines + indicators + mainforce)'
