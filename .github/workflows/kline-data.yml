name: Generate K-line Data Package

on:
  # ★ 2026-09-08：GitHub 自带 schedule 已停用 —— 实测延迟可达 5 小时
  #   （16:00 的定时任务 20:47 才启动），且与第三方定时服务重复触发 → 每天双跑。
  #   现在统一由 https://console.cron-job.org/ 配置 `0 18 * * 1-5`
  #   （北京时间 18:00）调用本文件的 workflow_dispatch 触发，时间准时可控。
  # ★★ 2026-10-19 GitHub API 实测：cron-job.org 的时区**确实是 Asia/Shanghai**，
  #   本文件准点在 **18:00（北京）** 启动，pack 19:00 → 20:17 完成，日批 20:17~22:39。
  #   ⚠️ 之前在库里看到的 02:53 / 03:06 并不是本链路的时刻，而是
  #      **兜底 schedule 触发的重复日批**（见 `backend-pack.yml` 的 `0 14 * * 1-5` UTC
  #      被 GitHub 延迟到次日 01:50，guard 秒跳过但结论仍 success ⇒ 日批被再拉起来跑一遍）。
  #      该重复已由 `scripts/daily_batch.py:_batch_already_done()` 拦住。
  # ★ 2026-09-13：由 16:00 推迟到 18:00 —— 腾讯当日 K 线在 16:00 时常未更新完整，
  #   会把「缺末根」的当日数据打进去（历史上专门为此写过"末根补齐重试"）。
  #   注意：仅收盘后运行，盘中拉取会被腾讯限流且当日 K 线不完整。
  workflow_dispatch:
    inputs:
      days:
        description: 'K线天数'
        required: false
        default: '150'

# 并发控制：同一时间只运行一个实例
concurrency:
  group: kline-data
  cancel-in-progress: false

jobs:
  # ── Job 1：前端包（全市场行情拉取 + 1564 只×150 天）─────────────
  # 独立 runner = 独立出口 IP：与后端包的腾讯限流窗口不叠加
  # （同 IP 串行双拉曾把后端行情批次打到全线超时，2026-09-06 实测）
  frontend-pack:
    name: 前端包（行情拉取 + K线包）
    runs-on: ubuntu-latest
    # ★ 2026-09-11：新增「末根补齐」重试（腾讯复权序列收盘后逐只更新，18:00 那一轮
    #   近半股票还缺当日）→ 最坏情况补拉 700+ 只，串行约 20 分钟；原 60 分钟偏紧。
    # ★ 2026-09-23：90 → **150**。实测 9-22 那次 job 跑到 **90 分 24 秒**被判超时
    #   ⚠️ GitHub 把 job 超时表现为 `cancelled`（不是 `failure`）⇒ 极易误判成"被后跑的
    #   backend-pack 取消"；实际本 workflow 两处 concurrency 都是 `cancel-in-progress: false`。
    #   后果：紧随其后的「发布 GitHub Pages」job 变 **skipped** ⇒ 当天
    #   `kline-pack-YYYYMMDD` 与 `kline-pack-latest` 都没更新（前端一直停在 9-21 的包，
    #   用户在页面上点「更新数据」只看到"暂无更新"）。平时约 37 分钟完成（18:00→18:37），
    #   出问题的日子是腾讯限流重试把时间拖长。放宽到 150 分钟留足重试余量。
    # ★★ 2026-10-21：150 → **240**。10-20 那轮在 2144 只（池扩容后）被 WAF 限到
    #   实际 ≈0.4 QPS，150 分钟只跑到 ~1000 只就被 timeout 砍掉（表现为 cancelled，
    #   连带 Pages 发布 skipped）。腾讯当前配额下 2144+末根补齐 ≈ 120~150 分钟，
    #   240 分钟给重试留余量。⚠️ 若日志末尾 WAF 汇总显示拦截 ≥ WAF_MAX_EVENTS，
    #   脚本会主动报错（failure）而不是熬到 cancelled —— 直接重跑换 runner/IP 更快。
    timeout-minutes: 240

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ★ 2026-10-21：把出口 IP 打进日志 —— 后端包 job 也有一条同样的记录。
      #   腾讯是 IP 级配额；两条 job 若落到同一 IP，后跑的那条会一开局就没额度
      #   （10-20 后端包第 1 次 WAF 出现在 99 只，就是这个形态）。
      - name: Log egress IP (WAF diagnosis)
        run: curl -s --max-time 10 https://api.ipify.org || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -q -r backend/requirements.txt

      - name: Generate K-line data package (frontend)
        # ★ 全市场行情拉取后落盘 realtime-quotes.json——后端 job 通过 artifact 复用（0 请求）
        # ★★ 2026-10-21：限速参数显式写进 workflow（原来吃脚本默认 2 QPS）。
        #   10-20 实测 2 QPS 会在 ~350 个请求后触发 501，之后每 120s 只放行 ~50 个
        #   （≈0.4 QPS 的硬配额）；起手 1 QPS + 撞墙后脚本内自适应 ×0.6 降速，
        #   总耗时反而更短（少撞墙 = 少罚站）。QPS_MIN=0.3 防止降得跑不完。
        env:
          PACK_QPS: '1'
          PACK_QPS_MIN: '0.3'
          PACK_WAF_COOLDOWN: '120'
          # ★ 2026-10-21：300 → 600。实测 300s 仍排不空腾讯的滑动窗口
          #   （冷却结束立刻又被拦，成功数逐级下滑）；给它 10 分钟才能真解除。
          PACK_WAF_MAX_COOLDOWN: '600'
          # 2144 只 → 撞墙是常态而非异常：上限放宽到 40 次（脚本默认 30）
          PACK_WAF_MAX_EVENTS: '40'
        run: |
          python scripts/generate-kline-pack.py \
            --output-dir ./data/kline \
            --quotes-file ./data/kline/realtime-quotes.json \
            --days ${{ github.event.inputs.days || 150 }}

      - name: Upload Pages artifacts (kline packs)
        uses: actions/upload-artifact@v4
        with:
          name: kline-pages
          path: |
            ./data/kline/kline-pack-latest.json.gz
            ./data/kline/kline-pack-*.json.gz
            # ★ 同步发布全市场行情：后端包已拆到独立 workflow（错峰 17:50），
            #   无法再用 artifact 传递，改从 Pages 取（~150KB，1 请求）
            ./data/kline/realtime-quotes.json
          retention-days: 3

      - name: Upload quotes artifact (backend reuse)
        uses: actions/upload-artifact@v4
        with:
          name: realtime-quotes
          path: ./data/kline/realtime-quotes.json
          retention-days: 3

      - name: Upload artifact (for debugging)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kline-data-debug
          path: ./data/kline/
          retention-days: 7

  # ── 发布前端包到 GitHub Pages ──────────────────────────────────────
  # ★ 后端包已拆到独立 workflow（backend-pack.yml，17:50 错峰）：
  #   ① 腾讯是 IP 级限流，前端 1564 只跑完立刻接着跑后端 700 只×750 根，
  #      后端必然大面积 501/超时（2026-09-06 实测：前端每次成功、后端必超时）；
  #   ② 错峰 1h50m 后配额已恢复，且资金流（17:00 回填）已就绪，
  #      mainforce 才能用当日强口径而不是 T-1。
  deploy-pages:
    name: 发布 GitHub Pages（前端包）
    needs: [frontend-pack]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # ★ gh-pages 发布全局串行锁（2026-09-08）：与 backend-pack 的发布共用一组。
    #   peaceiris 是「clone 分支 → 改文件 → force push」，两个 workflow 并发发布时，
    #   后 push 的会基于旧树把先 push 的文件覆盖掉（实测：新前端包被 backend-pack
    #   的发布覆盖回 09-05 旧版）。串行化后 clone 总是最新树，互相保留对方的文件。
    concurrency:
      group: gh-pages-publish
      cancel-in-progress: false

    steps:
      - name: Download pack artifacts
        uses: actions/download-artifact@v4
        with:
          name: kline-pages
          path: ./data/kline

      - name: Upload to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GH_PAGES_TOKEN }}
          publish_dir: ./data/kline
          publish_branch: gh-pages
          destination_dir: data
          keep_files: true  # 保留其他文件，只更新 data 目录
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'chore: update kline data package (frontend + backend)'