name: Generate K-line Data Package

on:
  # 每日收盘后自动运行（北京时间 16:00 = UTC 08:00）
  schedule:
    - cron: '0 8 * * 1-5'  # 周一到周五
  
  # 支持手动触发（用于测试）
  # 注意：建议在收盘后（北京时间 16:00 后）运行，盘中拉取会被腾讯限流且当日K线不完整
  workflow_dispatch:
    inputs:
      days:
        description: 'K线天数'
        required: false
        default: '150'

# 并发控制：同一时间只运行一个实例
concurrency:
  group: kline-data
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120   # 前端包(3000只×150天) + 后端包(1394只×500天) 串行，放宽到 2h
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        # 装完整 requirements（含 fastapi）：generate_backend_pack 复用后端
        # compute_latest_indicators，其导入链会牵出 fastapi 等依赖，
        # 精简安装会在指标计算步骤全军覆没（2026-09-05 实测）
        run: pip install -q -r backend/requirements.txt
      
      - name: Generate K-line data package (frontend)
        run: |
          python scripts/generate-kline-pack.py \
            --output-dir ./data/kline \
            --days ${{ github.event.inputs.days || 150 }}
      
      # 后端数据包（500根K线+预计算指标）：DATA_SOURCE=pack/local 读取层用，
      # 让 Render/本地不再读 Supabase 肥表（egress 根治）。
      # DATABASE_URL 仅用于读代码清单（~11KB），未配置时自动退化为市值前800。
      - name: Generate backend data pack (klines + indicators)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/generate_backend_pack.py --output-dir ./data/kline
      
      - name: Upload to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GH_PAGES_TOKEN }}
          publish_dir: ./data/kline
          publish_branch: gh-pages
          destination_dir: data
          keep_files: true  # 保留其他文件，只更新 data 目录
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'chore: update kline data package'
      
      - name: Upload artifact (for debugging)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kline-data
          path: ./data/kline/
          retention-days: 7
