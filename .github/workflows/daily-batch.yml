name: Daily Batch

on:
  # ★ 主触发：后端包 workflow 成功后自动跑（不再猜时间）。
  #   后端包实测 1h43m，19:00 开始 → ~20:43 完成 → 本任务立即接棒，
  #   拿到的必然是今天的新包。
  workflow_run:
    workflows: ["Generate Backend Data Pack"]
    types: [completed]

  # 注：原 20:30 的兜底 schedule 已停用（2026-09-08）——后端包改由第三方定时
  #   19:00 触发后，本任务由 workflow_run 接棒即可；保留 cron 会在同一天
  #   重复跑一次日批（约 74 分钟）。若后端包整天没跑，手动 dispatch 本任务。

  # ★ 手动触发：前端「重算/扫描」按钮通过 GitHub API 转发到这里，
  #   计算全程在 Actions（4核16G），Render 只负责之后读结果（不占内存）
  workflow_dispatch:
    inputs:
      tasks:
        description: '任务列表（逗号分隔，或 all）'
        required: false
        default: 'all'
      force:
        description: '忽略已完成标记强制重跑（true/false）'
        required: false
        default: 'false'

concurrency:
  group: daily-batch
  cancel-in-progress: false

jobs:
  # ★ 守卫：workflow_run 触发时只在后端包「成功」后继续；定时/手动触发直接放行。
  #   （后端包失败时新包没发出来，日批硬跑会拿昨天的数据，跑了也是白跑）
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Check upstream success
        run: |
          EVENT="${{ github.event_name }}"
          CONC="${{ github.event.workflow_run.conclusion }}"
          echo "event=$EVENT upstream_conclusion=$CONC"
          if [ "$EVENT" = "workflow_run" ] && [ "$CONC" != "success" ]; then
            echo "::error::上游 backend-pack 未成功（$CONC），跳过日批"
            exit 1
          fi

  daily-batch:
    name: 日批（战法/矛盾/回填/快照/日报）
    needs: guard
    runs-on: ubuntu-latest
    # ★ 2026-09-11：新增 news_snapshot（+1 分钟）与 weekly_report（周五，全策略回测
    #   +10~20 分钟）；叠加后端包扩容到战法池口径后扫描/精算榜耗时上升，放宽到 180。
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        # 完整依赖：日批要 import 后端各模块（scoring/strategies/contradictions…）
        run: pip install -q -r backend/requirements.txt

      - name: Smoke import (fail fast)
        run: |
          cd backend
          python -c "import app.main; print('smoke import ok')"

      - name: Run daily batch
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          WECHAT_WEBHOOK: ${{ secrets.WECHAT_WEBHOOK }}
          # ★ 2026-09-21：zzshare 每日数据积累（zz_daily 任务）需要 token —— 匿名会 0 行/慢。
          #   需在仓库 Secrets 新增 ZZSHARE_TOKEN（值同 Render 的环境变量；官网免费领取）。
          ZZSHARE_TOKEN: ${{ secrets.ZZSHARE_TOKEN }}
          # ★ 数据源走数据包：K线/指标/主力行为全部读 pack，零回源 → 无 WAF 风险
          DATA_SOURCE: pack
          # ★ LLM 解读（2026-09-09 补上：此前未引用 → AI 解读一直显示"未配置"）
          # ★★ 2026-09-17：主力站（SiliconFlow / DeepSeek-R1）**余额耗尽（实测 402）**
          #   → 这三行**主动不再引用**，让主力站彻底下线。理由不只是"欠费"：
          #   留着它当兜底会把免费站的**真实错误掩盖**成 402（本次排障就被误导过，
          #   真因是 SenseNova 的 429 tpm/rpm 限流）。要恢复 R1 就把下面三行改回
          #   `${{ secrets.LLM_API_KEY }}` 等形式。
          # LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          # LLM_MODEL: ${{ secrets.LLM_MODEL }}
          # LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          # ★ 正式链路 = SenseNova 日日新（免费站槽位，支持 reasoning_effort 注入）
          # ★★ 2026-09-17：主力站（SiliconFlow / DeepSeek-R1）余额耗尽 → 切 SenseNova。
          #   此前本步骤**只引用主力站三个变量、完全没有 LLM_FREE_*** → 免费站只在
          #   本地生效，日批一直用欠费的 R1（日报/矛盾报告 AI 解读静默全失败）。
          #   LLM_FREE_SHADOW=0 → 免费站进正式链首；上面三行保留作链尾兜底
          #   （首站成功即返回，平时不会打到 R1；彻底下线就把 LLM_MODEL secret 清空）。
          #   ⚠️ 需要在仓库 Secrets 里新增 LLM_FREE_API_KEY（= SenseNova 的 key，
          #      与 LLM_API_KEY 不是同一个）。
          LLM_FREE_BASE_URL: https://token.sensenova.cn/v1
          LLM_FREE_MODEL: deepseek-v4-flash
          LLM_FREE_API_KEY: ${{ secrets.LLM_FREE_API_KEY }}
          LLM_FREE_SHADOW: '0'
          # ★ 2026-09-14：对齐业务开关（此前 Actions 未配 → 全用代码默认值，
          #   与 Render 跑出不同结果，即审查文档 §4 的「部署漂移」）。日批是
          #   唯一写库计算入口，白名单判据必须以 expectancy 为准：
          #   win_rate 判据要求胜率≥55%，而该体系胜率天花板≈50% → 白名单恒空
          #   → 战法推送静默（见 recommendation.py:41-47 的复核说明）。
          WHITELIST_CRITERION: expectancy
          # 宽度崩塌风控钩子：severe 次日新仓风险额减半 + 趋势类战法暂停推送/入池
          # （risk_hook._hook_enabled 判 == "1"，故必须传字符串 '1'）。
          CONTRADICTION_RISK_HOOK: '1'
          # 主力出货乘数闸门：本地 .env 已用 auto、.env.example 亦建议 auto，
          # 此前 Actions/Render 均未配（=off）→ 与本地意图不符。P1-12 方案A 后
          # 该值仅影响 mainforce 标签（mult/active），不再影响排序/分数。
          # ⚠️ Render 控制台需同步配 MAINFORCE_MODE=auto（代码侧无法代改）。
          MAINFORCE_MODE: auto
        run: |
          python scripts/daily_batch.py \
            --tasks ${{ github.event.inputs.tasks || 'all' }} \
            ${{ github.event.inputs.force == 'true' && '--force' || '' }}

      # ★★ 2026-09-26（用户："我的方案是日批 actions 完成的时候发到企微，**而不是轮询的方式**"）
      #   日批跑完**主动回调**后端 ⇒ 后端即时推一条企微「复盘已就绪」（**事件驱动、零轮询**）。
      #   演进留档：① 前端页面自己重试 → 用户否决"不要让页面自己等"；
      #             ② 后端每 5 分钟轮询三表 → 用户否决"而不是轮询的方式"；③ 本步骤。
      #   ⚠️ **失败**不走这里：`daily_batch.py` 内部已在推失败告警（workflow env 里有
      #     `WECHAT_WEBHOOK`）⇒ 成功/失败两种情形都有通知渠道，无需 `if: always()`。
      #   ⚠️ 需要两个 GitHub secret：`BATCH_CALLBACK_TOKEN`（须与 Render env 同名同值）与
      #     `RENDER_BACKEND_URL`（keep-alive.yml 已在用）。**未配置则跳过**，不让 CI 变红。
      - name: Notify backend (batch done)
        if: success()
        run: |
          if [ -z "${{ secrets.BATCH_CALLBACK_TOKEN }}" ]; then
            echo "未配置 BATCH_CALLBACK_TOKEN，跳过完成通知（见本步骤注释）"
            exit 0
          fi
          if [ -z "${{ secrets.RENDER_BACKEND_URL }}" ]; then
            echo "未配置 RENDER_BACKEND_URL，跳过完成通知"
            exit 0
          fi
          # 日期用北京时间（runner 是 UTC）—— 后端也接受省略（会取最近已完成交易日）
          BJ_DATE=$(date -u -d '+8 hours' +%Y-%m-%d)
          curl -sS --max-time 60 -X POST \
            "${{ secrets.RENDER_BACKEND_URL }}/api/system/batch-done" \
            -H "X-Batch-Token: ${{ secrets.BATCH_CALLBACK_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"date\":\"$BJ_DATE\"}" \
            -w "\nHTTP %{http_code}\n" || echo "通知失败（不影响日批结果，后端未就绪时可稍后补跑）"

      - name: Summary
        if: always()
        run: |
          echo "日批任务结束，详见上方日志"
          echo "失败项会打印 error 标记并推送企微告警"
