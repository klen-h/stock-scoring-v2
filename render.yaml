services:
  - type: web
    name: stock-scoring-backend
    env: docker
    region: singapore
    # ⚠️ 免费版两个限制，对本项目影响很大：
    #   1) 15 分钟无访问会休眠 → 内置调度器（快讯轮询/三段复盘/信号跟踪）停摆
    #      → 若坚持免费版，用 cron-job.org 每 10 分钟 ping 一次 /api/health 保活
    #   2) 文件系统临时 → 每次部署/重启 backend/data/ 清零（信号跟踪、胜率统计、
    #      诊断历史全部丢失）→ 需要下方 disk（付费计划才支持）
    # 本项目是常驻后台任务型应用，长期建议 starter 计划 + 磁盘。
    plan: free
    branch: main
    # rootDir=backend：Dockerfile 在 backend/ 下（仓库根没有 Dockerfile），
    # 不设此项时 Blueprint 按仓库根找 ./Dockerfile 会构建失败；
    # 且控制台手动改 Root Directory 会造成配置漂移、自动部署停摆。
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: yes
    envVars:
      - key: TZ
        value: Asia/Shanghai
      # ★ 2026-09-25：服务端**没设 DATA_SOURCE ⇒ 默认 db（读 Supabase）**。
      #   实测（egress 探针，14 天窗口）：`backtest_prices` 的"大 IN 全历史 OHLCV"查询
      #   约 105 次 / ≤500MB 就来自这里（以及本地不带 pack 的脚本）——日批那边
      #   `daily-batch.yml` **早就设了** `DATA_SOURCE: pack`，所以不是它。
      #   改成 `pack` 后日线/指标走 GitHub Pages 数据包（零 Supabase 流量，30h 新鲜度，
      #   过期自动重下）。⚠️ 需在 **Render 控制台**手动加（本文件只是变量清单文档，不生效）。
      - key: DATA_SOURCE
        value: pack
      # 敏感变量：sync: false = 值在 Render 控制台填写，不随仓库同步。
      # （这就是 .env 不入库的另一半：仓库只留变量名，值存平台。）
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: LLM_BASE_URL
        sync: false
      # ★ 2026-09-17：主力站（SiliconFlow / DeepSeek-R1）余额耗尽 → 正式链切到
      #   SenseNova 日日新（deepseek-v4-flash）。上面 LLM_* 三行**保留作链尾兜底**
      #   （首站成功即返回，平时不会打到 R1；彻底下线就把 LLM_MODEL 值清掉）。
      #   ⚠️ 不要把 SenseNova 填进上面的 LLM_BASE_URL/LLM_MODEL —— 那是主力站槽位，
      #      在 app/flash/llm.py::_providers() 里标 "reasoning": False，
      #      会丢掉 reasoning_effort 注入（渲染任务需压低思考，见该文件注释）。
      - key: LLM_FREE_BASE_URL
        value: https://token.sensenova.cn/v1
      - key: LLM_FREE_MODEL
        value: deepseek-v4-flash
      - key: LLM_FREE_API_KEY
        sync: false
      # 0 = 免费站进正式链首（1 = 影子模式，只记录不投喂）
      - key: LLM_FREE_SHADOW
        value: '0'
      - key: FLASH_COOKIE
        sync: false
      - key: WECHAT_WEBHOOK
        sync: false
      # ★ JWT 签名密钥（控制台填任意固定随机串，如 64 位 hex）。
      #   不配置时代码按容器 HOSTNAME 推导 → 免费版每次休眠唤醒/重新部署
      #   HOSTNAME 都变 → 密钥变 → 所有用户 token 失效、每天都要重新登录。
      - key: JWT_SECRET
        sync: false
    # 数据持久化（需付费计划，取消注释即可启用）：
    # 保存 tracking.json（信号与胜率）、analyses.json（诊断全文）、macro_history.json（宏观历史）
    # disk:
    #   name: stock-data
    #   mountPath: /app/backend/data
    #   sizeGB: 1
