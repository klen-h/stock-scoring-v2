# ==============================================================================
# Coach 规则配置（W1 纯规则骨架，2026-09-13）
# ==============================================================================
# ★ 红线（PLAN §2.4 评审）：阈值集中在此文件（可调、可回滚），判据的**输入**
#   一律取现有信号源（regime / macro / margin_sentiment / breadth / 持仓），
#   代码里不写死点位或行情常量。
#
# 字段：
#   id       规则标识（实现注册在 app/coach/rules.py 的 EVALUATORS）
#   label    中文名（落库/推送用）
#   enabled  总开关（false = 完全不评估）
#   push     true = 触发时推企微；false = 只落库攒样本（逐周放开）
#   severity alert(硬警报) / warn(提示) / info
#   params   可调阈值（外部顾问建议值 → 可随时改，不改代码）
#
# 上线纪律（简报 §3.5 / PLAN §2.4）：
#   **第一周仅 stop_loss_hit + hold_3d_review 两条推送**，其余只落库；
#   逐周放开，防止警报密集导致用户第三天免疫。
# ==============================================================================
version: coach-rules-v1
# ★ 2026-10-25（BK-63）：真实持仓默认止损（%），与前端 stopLossPct 一致（原硬编码
#   在 rules.py 的 -8.0 迁入；env COACH_REAL_STOP_LOSS_PCT 可临时覆盖）。
real_stop_loss_pct: -8.0

rules:
  # ── A. 持仓纪律（教练核心：把"临场决策"变成"事前决策"）───────────────────
  - id: stop_loss_hit
    label: 止损触发
    enabled: true
    push: true                 # ← 第一周开放
    severity: alert
    params: {}

  - id: hold_3d_review
    label: 持有满3日强制评估
    enabled: true
    push: true                 # ← 第一周开放
    severity: alert
    params:
      hold_days: 3             # 对齐退出 v2 的到期天数（paper_trading._max_hold）

  - id: loss_over_7pct
    label: 浮亏超7%
    enabled: true
    push: false                # 第一周只落库
    severity: warn
    params:
      loss_pct: 7.0            # 简报 §2.1

  - id: crowded_trim
    label: 拥挤赛道借反弹减仓
    enabled: true
    push: false
    severity: warn
    params:
      ret20_pct: 30.0          # 简报 §2.1「近 20 日涨幅 >30%」

  - id: distribution_cut
    label: 高位+主力出货（不等7%直接砍）
    enabled: true
    push: false
    severity: alert
    params:
      price_pos: 0.75          # 简报 §2.1

  # ── B. 市场闸门（引用 regime/breadth/macro/margin，不写死点位）─────────────
  - id: gate_no_add
    label: 环境不支持加仓
    enabled: true
    push: false
    severity: info
    params: {}                 # 判据取自 regime（无硬编码）

  - id: gate_reduce
    label: 减仓条件命中
    enabled: true
    # ★ 2026-09-29（P0 放开推送）：此前 push=false ⇒ 本卡 2.5 周已命中 4 次
    #   （9/24 10Y 5.11% + DXY 101.1；9/28 10Y 5.20% + DXY 101.1）却**从未主动提醒**，
    #   用户自述「触发器命中但仓位没降」⇒ 「只落库」对风控类卡不成立（人不会主动去查）。
    #   放开依据：① 风控类与战法买入信号同级（wechat 侧 force 穿透业务开关）；
    #   ② 频率极低（2.5 周 4 次）不会造成警报疲劳；③ 文案已补**定量上限**
    #   （position_sizing 引擎的 total_limit_pct，9/29 实测 = 0%）。
    push: true
    severity: warn
    params:
      us10y_pct: 5.0           # 简报 §2.3 减仓①
      dxy: 100.0
      margin_cold: 30.0        # 简报 §2.3 减仓③（margin_sentiment 寒冷区）

  - id: gate_add
    label: 加仓条件命中
    enabled: true
    push: false
    severity: info
    params:
      up_down_ratio: 0.8       # 简报 §2.3 加仓①
      limit_down_max: 10
      consecutive_days: 2

  # ── ★★ 2026-11-13（用户："新的加仓命中的规则加入了吗？"）─────────────────
  #   给「加仓」补**方向**判断：gate_add 只看涨跌比与跌停数，不看钱往哪流。
  #   实测 17 个触发日的 T+5：上证50 -0.83% / 沪深300 -1.85% / 创业板 -4.36%
  #     ⇒ 同一信号，买错方向代价约 5 倍。
  #   按「触发日近 5 日 权重 − 创业板」分组（v1 口径 = 沪深300、阈值 3pp）：
  #     分化度 ≥ +3pp → 创业板 T+5 -2.46%（胜率 33%，n=6）
  #     分化度 <  +3pp → 创业板 T+5 -5.80%（胜率  0%，n=8）
  #   ⇒ 分化度不足时**否决**：在 _BLOCKING_RULES 里，把加仓降级为
  #     "条件满足但方向不对，今日不执行"（复用既有 _arbitrate 消解层）。
  #   ⚠️ 只否决、不反向加仓：样本 17 个、分组后每组 6~8 个，不足以支撑反向信号。
  #   ⚠️ 数据是日批回填（15:40 后更新）⇒ 盘中读到的是昨日收盘的分化度，
  #      它是日频指标，不影响判定，但文案里必须标日期。
  #
  #   ★★★ 2026-11-14：口径切换 **权重端 沪深300 → 上证50**，阈值 **3.0 → 4.0**
  #     · 为什么换：沪深300 混中盘成长股，不是纯权重。同批触发日
  #       上证50 -0.83% vs 沪深300 -1.85%（差 1pp）⇒ 用 300 会低估权重抗跌。
  #     · 为什么阈值必须重算：3 年日线实测「近5日分化度」标准差
  #       上证50 **3.79** vs 沪深300 **2.97**（大 27%，与直觉相反）。
  #       沪深300@3.0 触发率 21.8%；上证50 要达同样 21.8% 需 **4.0**
  #       （若沿用 3.0 则触发率 31.8%，"明显分化"的日子凭空多 10pp）。
  #     · 效果验证：14 个可用触发日上两套口径 9/5 分组**完全相同**
  #       ⇒ 切换不改变现有结论（稳健），但**不能宣称新口径更好**；
  #         真实价值是语义正确。
  #     · ⚠️ 本值必须与 `app.style_spread.SPREAD_THRESHOLD` 一致；
  #       `rules.py` 的兜底默认值已改为引用该常量，此处是**实际生效值**。
  - id: gate_add_weak_direction
    label: 加仓方向不对（权重弱于成长）
    enabled: true
    push: false            # 与 gate_add 同属 info 级，不单独推送
    severity: info
    params:
      style_spread_min: 4.0    # 近5日 上证50−创业板 需 ≥ 该值(pp)，否则否决（2026-11-14 由 3.0 重校准）

  # ── C. 情绪熔断（W1 只落库标记；LLM 闭嘴逻辑属 W2 explainer）───────────────
  - id: emotion_fuse
    label: 当日浮亏超阈值（情绪熔断）
    enabled: true
    # ★★ 2026-11-08（盯盘计划 G4 收敛，用户确认口径）：push 放开——"当日浮亏提醒"
    #   由 coach 框架承担，自建 portfolio_alerts loop 同日停用（唯一出口）。
    #   ⚠️ 上线纪律：本条进推送集 ⇒ 观察第一周触发频次，异常即回滚 push:false。
    push: true
    severity: warn
    params:
      day_loss_pct: 2.0        # 简报 §3.4

  # ── D. 市场微观结构纪律（Phase 0 画像三条净产出，2026-09-16）─────────────────
  # 依据：scripts/rhythm_profile.py n=127（Gate 判定书 §6）：
  #   ① 确认流入=短期顶部选择器（流入确认日后 20 日 -2.2%，差 -236bp）
  #   ② 短期反转 R_{t-1}=-0.169（t=-2.33） ③ 涨日=主力轧差净卖日（+1%→-27亿）
  # 阈值 big_move_pct=1.5：画像为连续效应、无单点阈值来源，取「中等强度波动日」
  #   作启发式起点，Phase 0 宽度序列扩样后校准（参数表校准来源不空原则）。
  - id: no_chase_rally
    label: 大涨日不追
    enabled: true
    push: false
    severity: warn
    params:
      big_move_pct: 1.5

  - id: reversal_no_add
    label: 昨日大涨今日不加仓
    enabled: true
    push: false
    severity: info
    params:
      big_move_pct: 1.5

  - id: reversal_no_panic
    label: 昨日大跌不恐慌割肉
    enabled: true
    push: false
    severity: warn
    params:
      big_move_pct: 1.5

  # ── E. 外部领先（Phase 3，2026-09-20）─────────────────────────────────────
  # 依据：scripts/regime_external_lead_test.py（regime 历史重放 687 天）
  #   **只在 defensive 有增量价值**：防御市未预警日未来 5/10 日 +1.22%/+2.50%
  #   （超跌反弹），预警日退到 -0.22%/-0.33%（差 1.44/2.83pt；滞后 1 日可交易
  #   口径 10 日差 2.53pt）。⚠️ **同口径 5 日差仅 0.96pt（<1.0 门槛，不达标）**
  #   ⇒ 该信号的**可交易效力集中在 10 日窗**，别按 5 日读（2026-09-20 复核补充）。
  #   offensive/neutral 无增量（≤0.3pt）
  #   因子集复核（2026-09-20）：**VIX 曾因"预警定义硬编码 NQ+USD"而从未被评估**，
  #   补测后确认**不该加入** —— VIX 与 NQ 中度重叠（Jaccard 0.52，有 12 天独有），
  #   并入后 10 日差由 2.53pt **稀释至 2.05pt**（5 日 0.96→0.86）⇒ 维持两因子 ✓
  #   （注意：原"只有 NQ+UDI 有增量价值"的表述当时无实验依据，现已补齐；结论不变）
  #   ⇒ 评估器内**硬性限定 defensive**，不污染其他档。
  #   单变量领先性：纳指 1 日窗 IC +0.1609 ｜ 美元 5 日窗 IC -0.1005
  #   ⚠️ 这两个数来自 `macro_lead_backtest.py` 的 **same（同日）口径**，含**时区前视**
  #     （美股夜盘发生在 A 股收盘之后）⇒ **不可交易**；改按 lag1 可交易口径实测
  #     三者均塌陷至 |IC|≤0.04（见 `scripts/fake_lead_diagnosis.py`）
  #     ⇒ 本规则的价值**不在"线性领先"**，而在 defensive 脆弱 regime 下的
  #     **条件差异**（分组检验结论），这也是它硬性限定 defensive 的原因。
  #   （美债 10Y/30Y 仅 0.066，是同步不是领先 ⇒ 不用）。
  # 阈值 = 回测样本的 20/80 分位（纳指隔夜涨幅 / 美元 5 日累计），可调；
  #   usd5 数据不足（macro_daily 未攒够）时自动只用纳指一侧，不误报。
  # push=false：按上线纪律先只落库攒样本（逐周放开）。
  - id: external_lead_no_rebound
    label: 防御市外部预警（不期待反弹）
    enabled: true
    push: false
    severity: warn
    params:
      nq_pct: -0.76
      usd5_pct: 0.66
      usd5_days: 5

# ── 剧本（coach_plans）阈值（monitor.write_plan 消费）────────────────────────
# ★ 审查 P2-12：此前剧本三处与规则/执行打架（评估日数写死 3、price_pos 文本
#   写死 0.80、移动止损无人执行）。现阈值集中此处：
plan:
  trail_trigger_pct: 15.0    # 浮盈达此值后提示止损上移至成本（提醒口径，不自动改单）
  price_pos_cut: 0.75        # 与 distribution_cut.params.price_pos 同源
# ★★ 2026-11-08（盯盘计划 G4 融合 Step 1）：**展示层阈值段**——portfolio_radar 的
#   档位/文案阈值迁入（硬编码留 fallback）。语义=纯展示（定级/文案），不推送、
#   不进决策链；与 rules 段的推送纪律（第一周 2 条）互不影响。
#   来源：portfolio_radar.py:39-44（原硬编码，无注释依据，照搬不改值）。
display:
  loss_warn_pct: -8.0          # 浮亏 ≤ -8% ⇒ 提醒（与 real_stop_loss_pct 同值，语义是展示档位）
  loss_severe_pct: -12.0       # 浮亏 ≤ -12% ⇒ 高优先（coach rules 原缺"严重"档，必须保留）
  profit_high_pct: 20.0        # 浮盈 ≥ +20% ⇒ 提示（保护利润，非建议）
  day_drop_from_high_pct: -5.0 # 当日距日内最高 ≤ -5% ⇒ 冲高回落（coach 原缺）
  msg_cap: 3                   # 每只股票最多显示条数
