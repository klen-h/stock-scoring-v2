# ══════════════════════════════════════════════════════════════════════════════
# 生产站点配置（宝塔 Linux 面板 · 静态前端 + 后端反代）
# ══════════════════════════════════════════════════════════════════════════════
# 用法（两选一）：
#   A. 宝塔「网站 → 添加站点（纯静态）→ 设置 → 配置文件」里，把本文件内容
#      **整体粘贴**进去（记得把 server_name 改成你的 IP 或留 _）。
#   B. 直接用本文件覆盖 /www/server/nginx/conf/... 下对应站点配置。
#
# 为什么前后端同机部署：
#   前端 `baseURL = import.meta.env.VITE_API_BASE_URL || '/api'` ⇒ **代码不用改**，
#   只要 nginx 把 `/api` 转给后端，就是同源访问：无 CORS、无 HTTPS 混合内容问题。
#   ⚠️ 若把前端继续放在 GitHub Pages（HTTPS），后端也必须 HTTPS，
#      而大陆服务器给域名配证书需要 ICP 备案 —— 同机部署可以完全绕开这件事。
#   ⚠️ 用 **IP 直接访问 80 端口不需要备案**（备案约束的是"域名 + 大陆服务器"）。
# ══════════════════════════════════════════════════════════════════════════════

server {
    listen       80;
    # ★★ 2026-11-03（上线实测）：**这里必须写真实 IP，不能写 `_`**。
    #   宝塔的默认站点也是 `server_name _;`，且排在前面 ⇒ 两个泛匹配抢 80 时
    #   nginx 保留**先出现的**那个，请求会被宝塔默认页（2017 年的 index）接走。
    #   精确的 `server_name` **优先级高于** `_`，所以写 IP 才能稳定命中本站点。
    #   以后备案了域名，在这里再加一行域名即可（用空格分隔）。
    server_name  101.201.222.167;

    # ★ 前端产物目录：本地 `npm run build` 后把 `frontend/dist` 整个传到这里
    root   /www/wwwroot/stock-scoring-v2/frontend/dist;
    index  index.html;

    charset utf-8;
    client_max_body_size 20m;

    # ── 压缩 ──────────────────────────────────────────────────────────
    # 前端构建产物是 JS/CSS，gzip 后传输量约为 1/4
    gzip              on;
    gzip_min_length   1k;
    gzip_comp_level   5;
    gzip_types        text/plain text/css application/json application/javascript
                      application/x-javascript text/xml application/xml image/svg+xml;
    gzip_vary         on;

    # ── 后端 API 反代 ─────────────────────────────────────────────────
    # ⚠️ `proxy_pass` **不要**带 URI 部分（不能写成 http://127.0.0.1:8000/api/），
    #    否则会多拼一层 `/api`，全部 404。
    location /api/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        # ★ AI 解读 / 复盘这类同步 LLM 调用前端给了 120s 超时，
        #   nginx 默认 60s 会**先在网关超时**（前端只会看到 504，看不出是 LLM 慢）。
        proxy_connect_timeout 10s;
        proxy_send_timeout    180s;
        proxy_read_timeout    180s;

        # 后端返回可能是流式/大 JSON，关掉缓冲避免首字节被攒住
        proxy_buffering       off;
    }

    # ── 静态资源缓存 ──────────────────────────────────────────────────
    # vite 产物文件名自带 hash ⇒ 可以长效缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # `index.html` **绝不能缓存**：否则发版后用户一直加载旧版本，
    # 而旧 index.html 引用的旧 hash 资源已被删除 ⇒ 白屏。
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
    }

    # ── 静态资源缺失必须返回 404，不能回退到 index.html ────────────────
    # ★ 2026-11-03（上线后实测踩到）：没有这一段时，**缺失的 .js/.css 会被
    #   `try_files ... /index.html` 兜住** ⇒ 浏览器拿到 `text/html` 的 JS 响应，
    #   报 "Expected a JavaScript-or-Wasm module script but ... MIME type of text/html"。
    #   这个报错**完全看不出是"文件缺失"**，排查方向会被带偏（以为是 MIME 配置问题）。
    #   ⇒ 扩展名明确是资源的请求，找不到就老实返回 404。
    location ~* \.(?:js|mjs|css|json|png|jpe?g|gif|svg|webp|ico|woff2?|ttf|eot|map)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── SPA 路由回退 ──────────────────────────────────────────────────
    # 这是 hash 路由（`#/path`），理论上不需要回退；但保留可兜底直链访问
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 隐藏文件（.env / .git 等）一律拒绝
    location ~ /\. {
        deny all;
    }
}
