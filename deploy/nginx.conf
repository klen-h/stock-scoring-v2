# ============================================================================
# nginx 反代：HTTPS(443) → 本机 uvicorn(127.0.0.1:8000)
#
# ★ 硬前提：前端跑在 https://klen-h.github.io（GitHub Pages）。
#   HTTPS 页面调用 http://IP:8000 会被浏览器按 mixed content 直接拦截
#   （表现：排行榜转圈、控制台 net::ERR / blocked:mixed-content）。
#   所以 API 必须 HTTPS —— 需要「域名 + 证书」。
#   · 境外地域（香港/新加坡/硅谷等）：域名解析过去即可，无需备案
#   · 国内地域：域名必须完成 ICP 备案，否则 80/443 会被封
#
# 部署步骤：
#   1) apt install -y nginx certbot python3-certbot-nginx
#   2) 先把本文件放到 /etc/nginx/conf.d/api.conf，把 <你的域名> 全部替换
#   3) 证书（二选一）：
#      a) Let's Encrypt：certbot --nginx -d <你的域名>   （自动改配置 + 自动续期）
#      b) 腾讯云免费 SSL：控制台下载 nginx 证书，放到 /etc/nginx/ssl/，
#         然后解开下面 ssl_certificate / ssl_certificate_key 两行的注释
#   4) nginx -t && systemctl reload nginx
#   5) 腾讯云控制台 → 防火墙：放行 TCP 80 / 443（8000 不要放行）
# ============================================================================

# HTTP：ACME 校验放行，其余全部跳 HTTPS
server {
    listen 80;
    server_name <你的域名>;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name <你的域名>;

    # Let's Encrypt（certbot 会自动写入这两行，手动部署时确保路径一致）
    ssl_certificate     /etc/letsencrypt/live/<你的域名>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<你的域名>/privkey.pem;
    # 腾讯云证书方案：
    # ssl_certificate     /etc/nginx/ssl/<你的域名>_bundle.crt;
    # ssl_certificate_key /etc/nginx/ssl/<你的域名>.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # 评分/快讯等接口偶有长响应，放宽超时
    proxy_connect_timeout 15s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;      # 便于 SSE / 流式响应
    }
}
