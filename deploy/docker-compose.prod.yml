# ============================================================================
# 生产部署（腾讯云轻量应用服务器 / Docker CE）
#
# 2026-09-11 变更：加入本机 Postgres（Postgres → 自建，彻底摆脱 Supabase
#   egress 配额与 402 风险）。后端与数据库同机，走 compose 内网，**不映射端口**
#   （5432 永不暴露公网）。
#
# 与根目录 docker-compose.yml 的区别：
#   - 只起 backend + postgres（前端在 GitHub Pages，不需要在服务器跑）
#   - backend 只监听 127.0.0.1:8000，对外 HTTPS 由 nginx/Caddy/隧道反代
#   - 显式设只读模式：重活已在 GitHub Actions 日批，服务器只跑 API + 轻循环
#
# 用法（在服务器上）：
#   cd /opt/stock-scoring-v2
#   # ① backend/.env 里设好 POSTGRES_PASSWORD，并把 DATABASE_URL 指向本机库
#   docker compose -f deploy/docker-compose.prod.yml up -d --build
#   docker compose -f deploy/docker-compose.prod.yml logs -f
#   # 一次性迁数据：SUPABASE_DUMP_URL="..." bash deploy/migrate_supabase.sh
#
# 更新代码：git pull && docker compose -f deploy/docker-compose.prod.yml restart
# （requirements.txt 变了才需要 --build）
# ============================================================================
services:
  postgres:
    # ★ 与 Supabase 源库同大版本（17）：跨大版本 dump/restore 会有兼容性坑
    image: postgres:17-alpine
    container_name: stock-postgres
    # ★ 不映射宿主端口：只有 backend 能通过 compose 内网访问（5432 不开公网）
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    # 环境变量与后端共用 backend/.env（POSTGRES_DB/USER/PASSWORD）
    env_file:
      - ../backend/.env
    environment:
      TZ: Asia/Shanghai
      # 2C2G 机器：给 Postgres 留出的内存预算偏保守，避免与 backend 抢内存
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    command: >
      postgres
      -c shared_buffers=256MB
      -c effective_cache_size=512MB
      -c work_mem=8MB
      -c maintenance_work_mem=64MB
      -c max_connections=60
      -c log_min_duration_statement=2000
    healthcheck:
      # $$ = 转义，交给容器内 shell 展开（compose 不插值）
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-stockapp} -d $${POSTGRES_DB:-stockapp}"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: stock-backend
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # 只绑回环地址：外部一律走 nginx(443)，避免 http 明文暴露公网
      - "127.0.0.1:8000:8000"
    volumes:
      # 挂整个 backend：① git pull 后 restart 即生效（不用重建镜像）
      # ② backend/data/ 里的 pack（126MB SQLite）与历史数据持久化，重启不重下
      - ../backend:/app/backend
    env_file:
      - ../backend/.env
    environment:
      TZ: Asia/Shanghai
      # 只读模式（服务器只做 API + 快讯/持仓/模拟盘；日批在 Actions）
      DEPLOY_READ_ONLY: "1"
      ENABLE_HEAVY_JOBS: "0"
      # 数据源走包，杜绝回源拉 K 线（WAF 根治）
      DATA_SOURCE: pack
      # 2C2G 机器上把行情刷新降频（默认 120s 全市场刷新是内存尖峰来源之一）
      STOCK_CACHE_INTERVAL: "300"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  # 数据库数据卷（docker volume；备份走 deploy/backup_db.sh + crontab）
  pgdata:
