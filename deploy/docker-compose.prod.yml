# ============================================================================
# 生产部署（腾讯云轻量应用服务器 / Docker CE）
#
# 与根目录 docker-compose.yml 的区别：
#   - 只起 backend（前端在 GitHub Pages，不需要在服务器跑）
#   - 只监听 127.0.0.1:8000，对外 HTTPS 由 nginx 反代（见 nginx.conf）
#   - 显式设只读模式：重活已在 GitHub Actions 日批，服务器只跑 API + 轻循环
#
# 用法（在服务器上）：
#   git clone <repo> && cd stock-scoring-v2
#   cp backend/.env.example backend/.env  &&  vi backend/.env   # 填凭证
#   docker compose -f deploy/docker-compose.prod.yml up -d --build
#   docker compose -f deploy/docker-compose.prod.yml logs -f
#
# 更新代码：git pull && docker compose -f deploy/docker-compose.prod.yml restart
# （requirements.txt 变了才需要 --build）
# ============================================================================
services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: stock-backend
    ports:
      # 只绑回环地址：外部一律走 nginx(443)，避免 http 明文暴露公网
      - "127.0.0.1:8000:8000"
    volumes:
      # 挂整个 backend：① git pull 后 restart 即生效（不用重建镜像）
      # ② backend/data/ 里的 pack（126MB SQLite）与历史数据持久化，重启不重下
      - ../backend:/app/backend
    env_file:
      - ../backend/.env
    environment:
      TZ: Asia/Shanghai
      # 只读模式（服务器只做 API + 快讯/持仓/模拟盘；日批在 Actions）
      DEPLOY_READ_ONLY: "1"
      ENABLE_HEAVY_JOBS: "0"
      # 数据源走包，杜绝回源拉 K 线（WAF 根治）
      DATA_SOURCE: pack
      # 2C2G 机器上把行情刷新降频（默认 120s 全市场刷新是内存尖峰来源之一）
      STOCK_CACHE_INTERVAL: "300"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
