# ══════════════════════════════════════════════════════════════════════════════
# 生产编排（自有服务器 · 宝塔 Linux 面板 · 2C2G 阿里云）
# ══════════════════════════════════════════════════════════════════════════════
# 与仓库根目录的 `docker-compose.yml`（开发用）的区别：
#   1. **只起后端**。前端不走 Docker —— `frontend/Dockerfile` 用的是 `node:16`，
#      而项目 vite 是 ^5.4.0（要求 Node 18+），那个镜像**构建必然失败**。
#      前端改为「本地 npm run build → 上传 dist → 宝塔静态站点托管」。
#   2. **8000 端口只绑 127.0.0.1**。外网访问统一走 nginx 的 80 端口反代 `/api`，
#      后端端口不对外暴露（少一个攻击面，也避免安全组多开一个口子）。
#   3. **挂载 data/ 持久化**。`backend/data/` 存信号跟踪/诊断历史/宏观历史/
#      research-cache.db —— 不挂载则每次 `docker compose up` 重建容器就全丢。
#   4. 加了内存上限与日志轮转（2G 内存的机器，容器失控会连累面板和 nginx）。
#
# 用法（在仓库根目录执行）：
#   docker compose -f deploy/docker-compose.prod.yml up -d
#   docker compose -f deploy/docker-compose.prod.yml logs -f backend
#   docker compose -f deploy/docker-compose.prod.yml down
#
# ⚠️ 前置：仓库根目录下必须有 `backend/.env`（从 Render 控制台 Environment 复制）。
#    该文件含数据库密码等敏感信息，**不入库**（已在 .gitignore）。
# ══════════════════════════════════════════════════════════════════════════════

services:
  backend:
    build:
      # ★★ 2026-11-03（用户实测报错：「提示没有 requirements.txt」）：**必须从 backend/ 构建**。
      #   Dockerfile 里是 `COPY ./requirements.txt .` 和 `COPY . .`，
      #   这些路径**相对于构建上下文**（不是相对于 Dockerfile 所在目录）。
      #   `requirements.txt` 只在 `backend/` 下，仓库根目录没有
      #   ⇒ 若把 context 写成仓库根（`..`），第一步 COPY 就报 "not found"。
      #   （仓库根那份开发用 docker-compose.yml 也是这个错，它从没构建成功过。）
      context: ../backend
      dockerfile: Dockerfile
    image: stock-scoring-backend:prod
    container_name: stock-scoring-backend
    restart: unless-stopped
    env_file:
      - ../backend/.env
    environment:
      TZ: Asia/Shanghai
      # ★ 2026-11-02（Render 连爆 8 次 OOM 的对症开关）：
      #   glibc arena 数封顶 2 —— 多线程下每线程一个 arena、碎片不归还 OS，
      #   `memory_probe` 实测 RSS 大跳与线程数一比一。
      MALLOC_ARENA_MAX: "2"
      # ★ 同日：给 `asyncio.to_thread` 的默认执行器封顶。
      #   调度器里上百处 to_thread 原先走默认池（min(32, cpu+4)）= 完全不封顶，
      #   开机 25 个循环同时起跑 ⇒ 线程暴涨。
      ASYNCIO_POOL_WORKERS: "6"
    ports:
      # ★ 只绑本机：外网访问走 nginx 反代，不直接暴露 8000
      - "127.0.0.1:8000:8000"
    volumes:
      # 持久化：信号跟踪 / 诊断历史 / 宏观历史 / research-cache.db
      - ../backend/data:/app/backend/data
    # ★ 2G 机器上给容器设上限：闸门单次构建约 210MB + 基础占用约 200MB，
    #   1.5G 有充足余量；再高会挤掉宿主机上的 nginx 和宝塔面板。
    mem_limit: 1536m
    # 容器内自检（避免 curl 不存在的问题，用 Python 标准库）
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/health',timeout=5)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s        # 启动预热（regime 恢复/快照加载）较慢，给足 2 分钟
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
