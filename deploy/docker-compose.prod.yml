version: '3.8'

# ════════════════════════════════════════════════════════════════
# 阿里云 ECS（2核2G）生产编排：backend + postgres + caddy
# 用法见 deploy/checklist.md
# ════════════════════════════════════════════════════════════════

services:
  # ── 数据库（方案 B：同机自建，彻底脱离 Supabase 限额）──────────
  # 数据量 <200MB，内存占用 ~200MB；备份：deploy/backup_db.sh 定时 pg_dump
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: stockapp
      POSTGRES_USER: stockapp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}   # 在 deploy/.env.prod 里设置
      TZ: Asia/Shanghai
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockapp -d stockapp"]
      interval: 10s
      timeout: 5s
      retries: 5
    # ★ 不对公网开放端口——仅容器网络内可达

  # ── 后端 + 调度器（25 个循环随 FastAPI 常驻）────────────────────
  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    restart: unless-stopped
    # ★ 挂整个 backend 目录：data/ 状态文件（快讯状态/信号跟踪/宏观历史/
    #   kline_cache.json）随宿主机持久化，容器重建不丢
    volumes:
      - ./backend:/app/backend
    env_file:
      - ./backend/.env
    environment:
      TZ: Asia/Shanghai
      # 方案 B：同机 Postgres 容器（数据迁入后使用）
      DATABASE_URL: postgresql://stockapp:${POSTGRES_PASSWORD}@postgres:5432/stockapp
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8000"          # 仅容器网络内，由 Caddy 反代对外
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Caddy：自动 HTTPS（Let's Encrypt）+ API 反代 ────────────────
  # 前置条件：域名 A 记录指向本机 + ICP 备案完成（国内服务器 80/443 必需）
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"         # ACME HTTP-01 挑战 + http→https 跳转
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data       # 证书存储
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  pgdata:
  caddy_data:
  caddy_config:
